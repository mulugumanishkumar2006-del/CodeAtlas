version: '3.8'

services:
                        postgres:
                                                image: postgres:15-alpine
                                                container_name: codeatlas-postgres
                                                restart: always
                                                environment:
                                                                        POSTGRES_DB: codeatlas
                                                                        POSTGRES_USER: postgres
                                                                        POSTGRES_PASSWORD: postgrespassword
                                                ports:
                                                                        - '5432:5432'
                                                volumes:
                                                                        - postgres_data:/var/lib/postgresql/data
                                                healthcheck:
                                                                        test:
                                                                                                [
                                                                                                                        'CMD-SHELL',
                                                                                                                        'pg_isready -U postgres',
                                                                                                ]
                                                                        interval: 10s
                                                                        timeout: 5s
                                                                        retries: 5

                        redis:
                                                image: redis:7-alpine
                                                container_name: codeatlas-redis
                                                restart: always
                                                ports:
                                                                        - '6379:6379'
                                                volumes:
                                                                        - redis_data:/data
                                                healthcheck:
                                                                        test:
                                                                                                [
                                                                                                                        'CMD-SHELL',
                                                                                                                        'redis-cli ping',
                                                                                                ]
                                                                        interval: 10s
                                                                        timeout: 5s
                                                                        retries: 5

                        neo4j:
                                                image: neo4j:5-community
                                                container_name: codeatlas-neo4j
                                                restart: always
                                                ports:
                                                                        - '7474:7474'
                                                                        - '7687:7687'
                                                environment:
                                                                        NEO4J_AUTH: neo4j/neo4jpassword
                                                volumes:
                                                                        - neo4j_data:/data

                        backend:
                                                build:
                                                                        context: .
                                                                        dockerfile: Dockerfile.backend
                                                container_name: codeatlas-backend
                                                restart: always
                                                ports:
                                                                        - '8000:8000'
                                                environment:
                                                                        DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/codeatlas
                                                                        REDIS_URL: redis://redis:6379/0
                                                                        NEO4J_URI: bolt://neo4j:7687
                                                                        NEO4J_USER: neo4j
                                                                        NEO4J_PASSWORD: neo4jpassword
                                                depends_on:
                                                                        postgres:
                                                                                                condition: service_healthy
                                                                        redis:
                                                                                                condition: service_healthy

                        frontend:
                                                build:
                                                                        context: .
                                                                        dockerfile: Dockerfile.frontend
                                                container_name: codeatlas-frontend
                                                restart: always
                                                ports:
                                                                        - '3000:3000'
                                                environment:
                                                                        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
                                                depends_on:
                                                                        - backend

volumes:
                        postgres_data:
                        redis_data:
                        neo4j_data:
