name: CodeAtlas CI/CD Production Pipeline

on:
                        push:
                                                branches: [master, main]
                        pull_request:
                                                branches: [master, main]

jobs:
                        backend-test-and-lint:
                                                runs-on: ubuntu-latest
                                                steps:
                                                                        - uses: actions/checkout@v3

                                                                        - name: Set up Python 3.10
                                                                          uses: actions/setup-python@v4
                                                                          with:
                                                                                                  python-version: '3.10'

                                                                        - name: Install dependencies
                                                                          run: |
                                                                                                  python -m pip install --upgrade pip
                                                                                                  pip install -r requirements.txt
                                                                                                  pip install pytest pytest-cov black ruff

                                                                        - name: Run Black & Ruff Quality Checks
                                                                          run: |
                                                                                                  black --check apps/backend tests
                                                                                                  ruff check apps/backend tests

                                                                        - name: Run Backend Pytest Suite
                                                                          env:
                                                                                                  PYTHONPATH: apps/backend
                                                                                                  DATABASE_URL: sqlite:///./ci_test.db
                                                                          run: |
                                                                                                  pytest tests/ -v --cov=apps/backend

                        frontend-check:
                                                runs-on: ubuntu-latest
                                                steps:
                                                                        - uses: actions/checkout@v3

                                                                        - name: Set up Node.js 20
                                                                          uses: actions/setup-node@v3
                                                                          with:
                                                                                                  node-version: 20

                                                                        - name: Install pnpm
                                                                          uses: pnpm/action-setup@v2
                                                                          with:
                                                                                                  version: 8

                                                                        - name: Install JS dependencies
                                                                          run: pnpm install

                                                                        - name: Run TypeScript Check & Build
                                                                          run: |
                                                                                                  cd apps/web
                                                                                                  npx tsc --noEmit
