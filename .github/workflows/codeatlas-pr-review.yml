name: CodeAtlas Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  codeatlas-review:
    name: CodeAtlas Intelligence Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run CodeAtlas PR Reviewer CLI
        id: review
        env:
          PYTHONPATH: "."
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m backend.app.cli review \
            --repository "${{ github.repository }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --provider github \
            --format text

      - name: Post PR Review Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // Handled automatically via CodeAtlas Provider or CLI webhook
