name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install JS/TS Dependencies
        working-directory: apps/web
        run: pnpm install

      - name: ESLint Check
        working-directory: apps/web
        run: npx eslint . --ext .ts,.tsx --max-warnings 100 || true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Python Ruff Linter Check
        run: ruff check apps/backend --ignore E501,W503

      - name: Python Black Formatter Check
        run: black --check apps/backend --line-length 120
