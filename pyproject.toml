[tool.black]
line-length = 120
target-version = ["py310"]
exclude = '''
/(
    \.venv
  | \.git
  | __pycache__
  | alembic
)/
'''

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  ".venv",
  "__pycache__",
  "alembic",
]

[tool.ruff.lint]
ignore = ["E501", "W503", "E402", "F401"]
select = ["E", "W", "F"]
