[tool.black]
line-length = 120
target-version = ["py310"]
exclude = '''
/(
    \.venv
  | \.git
  | __pycache__
  | alembic
)/
'''

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  ".venv",
  "__pycache__",
  "alembic",
]

[tool.ruff.lint]
ignore = ["E501", "E402", "F401", "F811", "F821", "W291", "W293", "F841", "F541"]
select = ["E", "W", "F"]
